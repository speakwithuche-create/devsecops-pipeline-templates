# Keep every action version (and the example apps' dependencies) current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /examples/go-app
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /examples/python-app
    schedule:
      interval: weekly
