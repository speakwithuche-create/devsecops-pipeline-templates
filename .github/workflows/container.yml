# Reusable container supply-chain pipeline:
#   build -> vulnerability scan (gate) -> SBOM -> push -> keyless signature -> provenance
# Nothing is pushed if the scan fails, and nothing is pushed from pull requests.
name: container

on:
  workflow_call:
    inputs:
      context:
        type: string
        default: "."
      image-name:
        description: Image name without registry, e.g. my-org/my-app
        type: string
        required: true
      push:
        description: Push, sign and attest (normally only on the default branch)
        type: boolean
        default: false
      severity:
        description: Trivy severities that fail the build
        type: string
        default: CRITICAL,HIGH
    outputs:
      digest:
        description: Pushed image digest (empty when push is false)
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to GHCR
      id-token: write        # keyless signing and provenance (OIDC)
      attestations: write
      security-events: write # upload scan results
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      IMAGE: ghcr.io/${{ inputs.image-name }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build (load locally for scanning)
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Vulnerability scan (SARIF for the Security tab)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.35.0 (pinned by SHA after the March 2026 tag compromise)
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ inputs.image-name }}

      - name: Vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.35.0 (pinned by SHA after the March 2026 tag compromise)
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: ${{ inputs.severity }}
          ignore-unfixed: true
          exit-code: "1"

      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push
        if: inputs.push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha

      - uses: sigstore/cosign-installer@v3
        if: inputs.push
      - name: Sign image (keyless, Sigstore)
        if: inputs.push
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Build provenance attestation (SLSA)
        if: inputs.push
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
